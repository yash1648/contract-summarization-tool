<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Error', ~{::content})}">
<body>
<th:block th:fragment="content">
    <div class="text-center py-5" style="max-width:560px; margin:0 auto;">
        <div class="display-1 fw-bold mb-3" style="font-family:'Outfit',sans-serif; background:linear-gradient(135deg, var(--danger), #f87171); -webkit-background-clip:text; -webkit-text-fill-color:transparent;"
             th:text="${statusCode}">500</div>

        <div class="card shadow-sm mb-4">
            <div class="card-body p-4">
                <i class="bi bi-exclamation-triangle-fill text-danger d-block mb-3" style="font-size:2rem;"></i>
                <h4 th:text="${errorTitle}">Error</h4>
                <p class="text-muted mb-0" th:text="${errorMessage}">Something went wrong.</p>
            </div>
        </div>

        <div class="d-flex justify-content-center gap-3 mb-4 flex-wrap">
            <a th:href="@{/dashboard}" class="btn btn-primary">
                <i class="bi bi-house me-1"></i> Back to Dashboard
            </a>
            <button onclick="window.location.reload()" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-clockwise me-1"></i> Retry
            </button>
        </div>

        <div class="mt-4 pt-4" style="border-top:1px solid var(--border);">
            <p class="text-muted small fw-semibold mb-2">Troubleshooting:</p>
            <ul class="list-unstyled text-muted small mb-0" style="text-align:left; display:inline-block;">
                <li class="mb-1"><i class="bi bi-dot me-1"></i>Check server logs for detailed error information</li>
                <li class="mb-1"><i class="bi bi-dot me-1"></i>Verify AI service is running (if analysis features used)</li>
                <li class="mb-1"><i class="bi bi-dot me-1"></i>Ensure MongoDB is accessible</li>
                <li class="mb-1"><i class="bi bi-dot me-1"></i>Confirm uploaded files are valid PDFs or DOCX documents</li>
            </ul>
        </div>
    </div>
</th:block>
</body>
</html>
