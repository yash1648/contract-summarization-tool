<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Analysis Results', ~{::content})}">
<body>
<th:block th:fragment="content">

    <div class="page-heading">
        <i class="bi bi-bar-chart-line heading-icon"></i>
        <h2>All Analysis Results</h2>
        <a th:href="@{/contracts/upload}" class="btn btn-primary ms-auto">
            <i class="bi bi-plus-circle me-1"></i> Upload Contract
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Contract</th>
                            <th>Risk Score</th>
                            <th>Level</th>
                            <th>Flags</th>
                            <th>Analysed At</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${results.empty}">
                            <td colspan="6" class="text-center py-5">
                                <i class="bi bi-bar-chart d-block mb-2 fs-2 text-muted"></i>
                                <p class="text-muted mb-1">No analyses yet.</p>
                                <a th:href="@{/contracts/upload}">Upload a contract</a> to get started.
                            </td>
                        </tr>
                        <tr th:each="r : ${results}">
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <i class="bi flex-shrink-0"
                                       th:classappend="${r.contractFileName.toLowerCase().endsWith('.pdf')} ? 'bi-file-earmark-pdf-fill text-danger' : 'bi-file-earmark-word-fill text-primary'"></i>
                                    <a th:href="@{/contracts/{id}(id=${r.contractId})}"
                                       class="text-decoration-none fw-semibold text-truncate d-inline-block" style="max-width:200px;"
                                       th:text="${r.contractFileName}">file.pdf</a>
                                </div>
                            </td>
                            <td>
                                <span class="fw-semibold" th:text="${#numbers.formatDecimal(r.riskScore, 1, 1)}">0.0</span>
                                <span class="text-muted small ms-1">/10.0</span>
                            </td>
                            <td>
                                <span class="badge"
                                      th:classappend="${r.riskScore <= 3.3 ? 'badge-low' : (r.riskScore <= 6.6 ? 'badge-medium' : 'badge-high')}"
                                      th:text="${r.riskLevel}">LOW</span>
                            </td>
                            <td>
                                <span th:text="${r.riskReport != null ? r.riskReport.totalFlags() : 0}">0</span>
                                <span class="text-muted small ms-1"
                                      th:if="${r.riskReport != null}"
                                      th:text="|(${r.riskReport.penaltyClauses.size()}P, ${r.riskReport.terminationRisks.size()}T, ${r.riskReport.liabilityIssues.size()}L)|">
                                </span>
                            </td>
                            <td class="text-muted small" th:text="${#temporals.format(r.analyzedAt, 'dd MMM yyyy HH:mm')}">-</td>
                            <td class="text-end">
                                <a th:href="@{/analysis/{contractId}/results(contractId=${r.contractId})}" class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-eye"></i> View
                                </a>
                                <a th:href="@{/contracts/{id}(id=${r.contractId})}" class="btn btn-sm btn-outline-secondary">
                                    <i class="bi bi-info-circle"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</th:block>
</body>
</html>
