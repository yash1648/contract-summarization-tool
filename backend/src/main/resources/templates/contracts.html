<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Contracts', ~{::content})}">
<body>
<th:block th:fragment="content">

    <div class="page-heading">
        <i class="bi bi-folder2-open heading-icon"></i>
        <h2>All Contracts</h2>
        <span class="badge bg-secondary fs-6" th:text="${totalCount}">0</span>
        <a th:href="@{/contracts/upload}" class="btn btn-primary ms-auto">
            <i class="bi bi-upload me-1"></i> Upload New
        </a>
    </div>

    <!-- Summary mini-stats -->
    <div class="d-flex gap-3 mb-4 flex-wrap">
        <span class="small text-muted"><span class="fw-semibold text-white" th:text="${totalCount}">0</span> total</span>
        <span class="small text-muted"><span class="fw-semibold text-success" th:text="${completedCount}">0</span> completed</span>
        <span class="small text-muted"><span class="fw-semibold text-warning" th:text="${pendingCount}">0</span> pending</span>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>File Name</th>
                            <th>Type</th>
                            <th>Size</th>
                            <th>Chunks</th>
                            <th>Status</th>
                            <th>Uploaded</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${contracts.empty}">
                            <td colspan="7" class="text-center py-5">
                                <i class="bi bi-inbox display-6 d-block mb-2 text-muted"></i>
                                <p class="text-muted mb-1">No contracts uploaded yet.</p>
                                <a th:href="@{/contracts/upload}">Upload your first contract</a>
                            </td>
                        </tr>
                        <tr th:each="contract : ${contracts}">
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <i class="bi flex-shrink-0 fs-5"
                                       th:classappend="${contract.fileType.contains('pdf')} ? 'bi-file-earmark-pdf-fill text-danger' : 'bi-file-earmark-word-fill text-primary'"></i>
                                    <a th:href="@{/contracts/{id}(id=${contract.id})}"
                                       class="text-decoration-none fw-semibold text-truncate d-inline-block" style="max-width:220px;"
                                       th:text="${contract.fileName}">file.pdf</a>
                                </div>
                            </td>
                            <td>
                                <span class="text-muted small" th:text="${contract.fileType.contains('pdf') ? 'PDF' : 'DOCX'}">PDF</span>
                            </td>
                            <td class="text-muted small" th:text="${#numbers.formatDecimal(contract.fileSize / 1024.0 / 1024.0, 1, 2) + ' MB'}">0 MB</td>
                            <td th:text="${contract.totalChunks}">0</td>
                            <td>
                                <span class="status-pill"
                                      th:classappend="'status-' + ${contract.status.name()}"
                                      th:text="${contract.status.name().replace('_', ' ')}">UPLOADED</span>
                            </td>
                            <td class="text-muted small" th:text="${#temporals.format(contract.createdAt, 'dd MMM yyyy HH:mm')}">-</td>
                            <td class="text-end">
                                <div class="d-flex gap-1 justify-content-end">
                                    <!-- Analyze (if not completed) -->
                                    <form th:if="${contract.status != T(com.grim.backend.model.Contract.ProcessingStatus).COMPLETED}"
                                          th:action="@{/analysis/{contractId}/run(contractId=${contract.id})}" method="post" class="d-inline analyze-form">
                                        <button type="submit" class="btn btn-sm btn-outline-success btn-analyze" title="Run AI Analysis">
                                            <i class="bi bi-cpu"></i> Analyze
                                        </button>
                                    </form>
                                    <!-- View results (if completed) -->
                                    <a th:if="${contract.status == T(com.grim.backend.model.Contract.ProcessingStatus).COMPLETED}"
                                       th:href="@{/analysis/{contractId}/results(contractId=${contract.id})}"
                                       class="btn btn-sm btn-outline-primary" title="View Results">
                                        <i class="bi bi-eye"></i> Results
                                    </a>
                                    <!-- Detail -->
                                    <a th:href="@{/contracts/{id}(id=${contract.id})}" class="btn btn-sm btn-outline-secondary" title="View Details">
                                        <i class="bi bi-info-circle"></i>
                                    </a>
                                    <!-- Delete -->
                                    <form th:action="@{/contracts/{id}/delete(id=${contract.id})}" method="post" class="d-inline"
                                          onsubmit="return confirm('Delete this contract and all its data?\n\nThis cannot be undone.')">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ── Loading state on Analyze buttons ────────────────────
        document.querySelectorAll('.analyze-form').forEach(function(form) {
            form.addEventListener('submit', function() {
                var btn = form.querySelector('.btn-analyze');
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Analyzing…';
            });
        });
    </script>

</th:block>
</body>
</html>
