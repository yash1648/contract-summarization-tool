spring:
  application:
    name: ai-assistant-backend

  # MongoDB

  
  mongodb:
      uri: mongodb://admin:password@localhost:27017/ai_assistant_db?authSource=admin

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
      enabled: true

  # Thymeleaf
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

# Logging level
logging:
  level:
    root: INFO
    com.grim: DEBUG
    org.springframework.data.mongodb: WARN
    org.springframework.web.reactive.function.client: WARN

# File type
app:
  upload:
    dir: /home/grim/Project/ai-contract-system/uploads
    allowed-types: application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document

  # Chunking — semantic-friendly size for better RAG search quality
  chunking:
    size: 2000      # ~500 tokens — balances context size with search precision
    overlap: 200    # 10% overlap to preserve boundary context

  # Python AI service
  ai:
    service:
      url: http://localhost:5000
      enabled: true
      timeout-seconds: 1200
      health-timeout-seconds: 5
      max-retries: 0
      retry-delay-ms: 1000

# Server port
server:
  port: 6969
  tomcat:
    threads:
      max: 50
